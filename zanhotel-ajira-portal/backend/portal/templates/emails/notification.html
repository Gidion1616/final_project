<!doctype html>
<html lang="en">
  <body style="margin:0;background:#eef6fa;font-family:Arial,sans-serif;color:#102b46">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px">
      <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#fff;border-radius:14px;overflow:hidden">
          <tr><td style="padding:24px;background:#062a49;color:#fff"><strong style="font-size:20px">{{ portal_name }}</strong></td></tr>
          <tr><td style="padding:32px">
            <h1 style="font-size:24px;margin:0 0 18px;color:#087ea4">{{ heading }}</h1>
            <div style="font-size:15px;line-height:1.7;white-space:pre-line">{{ message }}</div>
            {% if action %}<p style="margin:28px 0 0"><a href="{{ action.url }}" style="display:inline-block;padding:12px 20px;background:#087ea4;color:#fff;text-decoration:none;border-radius:8px;font-weight:bold">{{ action.label }}</a></p>{% endif %}
          </td></tr>
          <tr><td style="padding:18px 32px;background:#f1f8fb;color:#61798e;font-size:12px">This is an automatic message from ZANHOTEL AJIRA PORTAL.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
